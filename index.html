<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Tiny 💜</title>

    <link rel="stylesheet" href="../Pessoais/albertina/style.css">
</head>

<body>

    <!--
        Coloca o ficheiro de áudio que tens autorização para usar em:
        assets/audio/te-vivo.mp3

        Nota: alguns navegadores bloqueiam música com som iniciada
        automaticamente. Por isso, o JavaScript também tenta iniciar
        a música quando a Tiny tocar no botão.
    -->
    <audio id="backgroundMusic" loop preload="auto">
        <source src="../Pessoais/albertina/assets/audio/marilia_mendonca_nem_e_bom_lembrar_decretos_reais_aac_70415.m4a" type="audio/mpeg">
    </audio>

    <main class="hero">

        <div class="stars"></div>

        <div class="hero-content">

            <p class="small-text">UM PRESENTE FEITO PARA TI</p>

            <h1>
                Feliz aniversário,
                <span>Tiny</span> 💜
            </h1>

            <p class="intro">
                De um número errado para uma história
                que ainda está sendo escrita.
            </p>

            <button id="openGift">
                Abrir
                <span>→</span>
            </button>

        </div>

        <div class="scroll-indicator">
            <span>desliza para descobrir</span>
            <div>↓</div>
        </div>

    </main>


    <section class="welcome" id="welcome">

        <p class="section-label">PARA A MINHA BUTTERFLY</p>

        <h2>
            Algumas histórias<br>
            merecem ser lembradas.
        </h2>

        <p>
            Esta é a nossa.
        </p>

        <a href="../Pessoais/albertina/lembrancas.html" class="memories-button">
            Ver as nossas lembranças
            <span>→</span>
        </a>

    </section>


    <script src="../Pessoais/albertina/script.js"></script>

</body>
</html>
